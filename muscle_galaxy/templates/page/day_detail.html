<body>
    <div style="max-width: 600px; margin: 20px auto; padding: 20px; background: white; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
        <h1>{{ date }} の記録</h1>
        <hr>
        <table style="width: 100%; text-align: left;">
            <tr><th>種目</th><th>部位</th><th>重量</th><th>回数</th></tr>
            {% for log in logs %}
                <tr>
                    <td>{{ log.workout_name }}</td>
                    <td>{{ log.body_part }}</td>
                    <td>{{ log.weight }}kg</td>
                    <td>{{ log.reps }}回</td>
                </tr>
            {% empty %}
                <tr><td colspan="4">この日の記録はありません。</td></tr>
            {% endfor %}
        </table>
        <br>
        <a href="/calendar/">⬅ カレンダーに戻る</a>
    </div>
</body>
