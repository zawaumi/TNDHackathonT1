{% extends "page/base.html" %}

{% block title %}食事 | Muscle Galaxy{% endblock %}

{% block content %}
<section class="page-head">
    <h1>食事</h1>
    <p>今日の食事、レシピ、AIプランの食事メニューを確認します。</p>
</section>

<section class="grid two">
    <div class="panel stack">
        <h2>今日の食事</h2>
        <div class="empty-state">食事記録はまだありません。</div>
        <div class="button-row">
            <a class="btn primary" href="/calendar/meal/recipe/">レシピを見る</a>
            <a class="btn" href="/ai-plan/">AIプラン</a>
        </div>
    </div>
    <div class="panel stack">
        <h2>目標</h2>
        <div class="grid two">
            <div class="metric">
                <span>カロリー</span>
                <strong>未設定</strong>
            </div>
            <div class="metric">
                <span>たんぱく質</span>
                <strong>未設定</strong>
            </div>
        </div>
    </div>
</section>
{% endblock %}
