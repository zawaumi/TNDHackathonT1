{% extends "page/base.html" %}

{% block title %}プロフィール | Muscle Galaxy{% endblock %}

{% block content %}
<section class="page-head">
    <h1>プロフィール</h1>
    <p>身長、体重、目標などAIプランの入力元になる情報を管理します。</p>
</section>

<section class="grid three">
    <div class="metric">
        <span>身長</span>
        <strong>未設定</strong>
    </div>
    <div class="metric">
        <span>体重</span>
        <strong>未設定</strong>
    </div>
    <div class="metric">
        <span>目標</span>
        <strong>未設定</strong>
    </div>
</section>

<section class="panel stack section-gap">
    <h2>操作</h2>
    <div class="button-row">
        <a class="btn primary" href="/edit/">編集</a>
        <a class="btn" href="/ai-plan/">AIプラン</a>
    </div>
</section>
{% endblock %}
