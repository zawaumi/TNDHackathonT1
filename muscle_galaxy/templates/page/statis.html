{% extends "page/base.html" %}

{% block title %}統計 | Muscle Galaxy{% endblock %}

{% block content %}
<section class="page-head">
    <h1>統計</h1>
    <p>トレーニング量、体重、食事目標の変化を確認します。</p>
</section>

<section class="grid three">
    <div class="metric">
        <span>総ボリューム</span>
        <strong>0 kg</strong>
    </div>
    <div class="metric">
        <span>記録日数</span>
        <strong>0日</strong>
    </div>
    <div class="metric">
        <span>平均体重</span>
        <strong>未設定</strong>
    </div>
</section>

<section class="panel stack section-gap">
    <h2>次の操作</h2>
    <div class="button-row">
        <a class="btn primary" href="/calendar/">カレンダー</a>
        <a class="btn" href="/ai-plan/">AIプラン</a>
    </div>
</section>
{% endblock %}
