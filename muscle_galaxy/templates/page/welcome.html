{% extends "page/base.html" %}

{% block title %}Muscle Galaxy{% endblock %}

{% block content %}
<section class="welcome-shell">
    <div class="welcome-copy">
        <span class="welcome-kicker">Training, meals, progress</span>
        <h1>Muscle Galaxyへようこそ</h1>
        <p>今日やること、食べるもの、積み上げた成果を一つの流れで確認できます。</p>
        <div class="welcome-actions">
            <a class="btn primary" href="/login/">ログイン</a>
            <a class="btn" href="/register/">登録</a>
        </div>
    </div>

    <div class="welcome-preview" aria-label="アプリ概要">
        <div class="preview-head">
            <span>Today</span>
            <strong>Upper Body Push</strong>
        </div>
        <div class="preview-row">
            <span>Workout</span>
            <strong>45 min</strong>
        </div>
        <div class="preview-row">
            <span>Meals</span>
            <strong>4 plans</strong>
        </div>
        <div class="preview-progress">
            <span></span>
        </div>
        <div class="preview-note">タイマー完了後、記録を自動で開始します。</div>
    </div>
</section>
{% endblock %}
