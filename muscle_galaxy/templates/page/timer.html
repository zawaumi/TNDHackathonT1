<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Timer MuscleGalaxy!</title>
    <style>
        /* ここにCSSを配置 */
        .timer-circle {
            width: 300px; height: 300px;
            border-radius: 50%;
            background-color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
        }
        .timer-controls { text-align: center; margin-top: 20px; }
        .btn-red { background-color: red; color: white; }
    </style>
</head>
<body>
    <h1>筋トレタイマー</h1>

    <div class="timer-wrapper">
        <div class="timer-circle">
            <h1 id="timer-display">00:00</h1>
        </div>
        
        <div class="timer-controls">
            <button id="start-stop-btn">一時停止/再開</button>
            <button id="skip-lap-btn">スキップ/ラップ</button>
            <button id="finish-btn" class="btn-red">終了</button>
        </div>
    </div>

    <script src="/static/js/timer.js"></script>
</body>
</html>
